name: Publish Astra OS to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (0.2.5 or v0.2.5)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish npm package
    runs-on: ubuntu-latest
    environment:
      name: npm-release
    steps:
      - name: Normalize release tag
        id: release-tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          release_version="${REQUESTED_TAG#v}"
          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version such as 0.2.5 or v0.2.5" >&2
            exit 1
          fi
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify version tag matches package
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")" || {
            echo "Tag $RELEASE_TAG does not match package version $(node -p "require('./package.json').version")" >&2
            exit 1
          }

      - name: Run test suite
        run: npm test

      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance
